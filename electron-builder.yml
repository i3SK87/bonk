appId: com.bonk.desktop
productName: BONK
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  # El icono lo necesitan la ventana y el icono de la bandeja, en tiempo de ejecución.
  - resources/icon.ico
# De dónde saca la aplicación las versiones nuevas. Además de publicar, esto es
# lo que hace que la compilación genere el «latest.yml» que consulta el
# actualizador: sin este bloque no hay con qué comparar.
publish:
  provider: github
  owner: i3SK87
  repo: bonk
win:
  # Aquí no se firma nada —no hay certificado—, así que la comprobación de firma
  # del actualizador rechazaría todas las descargas. Lo que sí se comprueba, y
  # eso no se toca, es el sha512 de cada archivo contra el del «latest.yml», que
  # viaja por HTTPS desde GitHub.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]
    # El zip es la vía de repuesto: si el filtro de Windows no deja pasar el
    # instalador, la carpeta suelta se descomprime y se ejecuta igual.
    - target: zip
      arch: [x64]
  # Vale para el zip; el instalador lleva el suyo, más abajo.
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BONK
  installerLanguages: [es_ES]
  language: 1034
