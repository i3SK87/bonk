<!--
  La marca de BONK: la máscara del atraco al furgón, sobre negro.

  Dibujada mirando el fotograma, y por eso es como es. La primera versión tenía
  ojos redondos y una bocaza, y salía una calavera de Halloween: la de la
  película tiene *rendijas*, no ojos, y la cara sembrada de agujeritos de
  ventilación. Eso es lo que la hace leerse como un aparato y no como una cara.

  Pero un icono vive a 16 px en la bandeja del sistema, donde todo eso se
  disuelve. Por eso el reparto es: la silueta y las dos rendijas aguantan
  siempre, y los agujeros y el caballete de la nariz solo aparecen de 32 px
  para arriba, como textura.

  El blanco es hueso, no blanco puro: es el de las máscaras y no deslumbra
  sobre el fondo negro.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0B0B0D" />

  <g transform="translate(256 258)">
    <!-- El casco. Va en coordenadas absolutas y no en trazos relativos: a mano,
         los relativos acumulaban error y la mitad izquierda salía más estrecha
         que la derecha, con la rendija del ojo comiéndose el borde. -->
    <path
      fill="#EDE7DC"
      d="M0-186
         C64-186 108-160 120-106
         C130-60 128-6 116 46
         C105 94 78 138 38 156
         C26 161-26 161-38 156
         C-78 138-105 94-116 46
         C-128-6-130-60-120-106
         C-108-160-64-186 0-186Z" />

    <!-- Las rendijas de los ojos: lo único que tiene que sobrevivir a 16 px. -->
    <path fill="#0B0B0D" d="M-76-40h54c7 0 12 5 12 12v10c0 7-5 12-12 12h-54c-7 0-12-5-12-12v-10c0-7 5-12 12-12Z" />
    <path fill="#0B0B0D" d="M22-40h54c7 0 12 5 12 12v10c0 7-5 12-12 12H22c-7 0-12-5-12-12v-10c0-7 5-12 12-12Z" />

    <!-- El caballete de la nariz y los dos agujeros de respirar. -->
    <path fill="none" stroke="#0B0B0D" stroke-width="7" stroke-linecap="round" d="M0-10v58" />
    <circle cx="-19" cy="66" r="8" fill="#0B0B0D" />
    <circle cx="19" cy="66" r="8" fill="#0B0B0D" />

    <!-- Los respiraderos: un arco en la frente y un par en cada pómulo. Más
         de estos y la cara se vuelve un balón de golf. -->
    <g fill="#0B0B0D">
      <circle cx="-58" cy="-118" r="6" />
      <circle cx="-29" cy="-132" r="6" />
      <circle cx="0" cy="-137" r="6" />
      <circle cx="29" cy="-132" r="6" />
      <circle cx="58" cy="-118" r="6" />
      <circle cx="-78" cy="26" r="6" />
      <circle cx="78" cy="26" r="6" />
      <circle cx="-68" cy="66" r="6" />
      <circle cx="68" cy="66" r="6" />
    </g>
  </g>
</svg>
